# Frequent incremental refresh.
#
# WHY THIS IS SEPARATE FROM collect.yml
# -------------------------------------
# collect.yml is the daily deep sweep: SearXNG keyword discovery, the
# review-directory audit, GDELT. It takes tens of minutes and cannot run often.
#
# This is the shallow, frequent one: the eleven KEYLESS sources, in one process,
# about a minute. It can run every two hours and keep the recent view current.
#
# Keyless is the load-bearing word. Bright Data suspended, DataForSEO ran out,
# Octolens moved its API behind a paid tier and twitterapi.io went to negative
# credits — all inside one week — and the dashboard did not report an outage, it
# reported a quiet week. Nothing this job depends on can be switched off by a
# billing balance.
#
# It exists because the hosted app CANNOT collect: a serverless function has
# neither the runtime budget nor a writable filesystem. Freshness on Vercel is
# therefore a function of how often this commits, and nothing else. Every run
# that finds new records pushes a commit, which redeploys with the new data.

name: Refresh recent

on:
  schedule:
    # Every 2 hours. GitHub queues cron on shared runners, so treat the interval
    # as approximate rather than exact.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days"
        required: false
        default: "7"
      full:
        description: "Include the slow discovery sources"
        type: boolean
        required: false
        default: false

concurrency:
  # Overlapping runs would race on the evidence store.
  group: refresh-recent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OCTOLENS_API_KEY: ${{ secrets.OCTOLENS_API_KEY }}
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      DATAFORSEO_B64: ${{ secrets.DATAFORSEO_B64 }}
      WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      # The metered routes the sweep uses where they are funded: SerpAPI is the
      # only path to LinkedIn, and ScrapingBee the only way past DuckDuckGo's
      # block page from a datacentre IP. Both are optional — without them those
      # two sources report a gap rather than a zero.
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
      SCRAPEBADGER_KEY: ${{ secrets.SCRAPEBADGER_KEY }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      # A scheduled job must not drain the month's SerpAPI quota in a week.
      SERPAPI_MIN_REMAINING: "40"
      # Keep a scheduled job inside a predictable spend.
      DATAFORSEO_MAX_PROBE_COST: "0.05"
      DATAFORSEO_MIN_BALANCE: "0.05"
      # No SearXNG on this runner; the fast path does not use it, and the SERP
      # provider falls back to DataForSEO where a query is needed.
      SERP_PROVIDER: auto

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh
        # sweep-live.js, not refresh-recent.js.
        #
        # refresh-recent.js spawns collect.js for a list of adapters chosen when
        # Octolens, Bright Data and SearXNG all worked. All three are now dark,
        # so that list collects almost nothing — and it collects nothing
        # QUIETLY, which is how the dashboard came to serve week-old data while
        # every scheduled run reported success.
        #
        # sweep-live.js runs the eleven keyless sources in-process. None of them
        # needs a key, so this job keeps working whatever the billing state of
        # the metered providers, which is the entire point of a scheduled
        # refresh.
        run: |
          DAYS="${{ github.event.inputs.days }}"
          [ -z "$DAYS" ] && DAYS=7
          node collectors/sweep-live.js --days=$DAYS

      - name: Normalise the store before auditing
        # SELF-HEAL, because a single bad row froze the dashboard for three days.
        #
        # The accuracy audit gates the commit step, and it is right to: data that
        # cannot be traced to evidence must not be served as fact. But on 2026-09-18
        # ONE duplicate row started failing it, every scheduled run since collected
        # fresh data and committed nothing, and the dashboard silently froze while
        # the crons kept firing every three hours.
        #
        # The identity bug behind that duplicate is fixed in lib/record.recordKey.
        # This step exists so the NEXT mechanical inconsistency costs one run
        # instead of three days: it collapses duplicates before the gate sees them.
        # It cannot mask a real problem — the audit still runs, still gates, and
        # anything it cannot mechanically resolve still fails the run.
        run: node collectors/dedupe-store.js

      - name: Accuracy audit
        # Fails the run rather than committing data that cannot be traced to
        # evidence and then serving it to the team as fact.
        run: node collectors/audit-mentions.js

      - name: Commit if anything advanced
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ collectors/store/mentions.json collectors/store/coverage.json \
                  collectors/store/runs.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new since the last refresh."
            exit 0
          fi
          NEWEST=$(node -e "try{console.log(require('./data/refresh-receipt.json').newest_after||'?')}catch(e){console.log('?')}")
          RECORDS=$(node -e "try{console.log(require('./data/meta.json').integrity.verified_records)}catch(e){console.log('?')}")
          git commit -m "data: refresh (newest $NEWEST, $RECORDS records)" \
                     -m "Automated 2-hourly incremental. Vercel redeploys from this commit."
          git push
