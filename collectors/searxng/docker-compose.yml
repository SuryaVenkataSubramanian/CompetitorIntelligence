# SearXNG for the Document360 competitive-intelligence collectors.
# Repo: https://github.com/searxng/searxng
#
#   docker compose -f collectors/searxng/docker-compose.yml up -d
#   # then: SEARXNG_URL=http://localhost:8888 npm run collect
#
# Why this exists: SearXNG replaces a paid SERP API (SerpAPI/Serper/Brave). It
# queries Google/Bing/DuckDuckGo/Brave/Startpage on your behalf, needs no API
# key, and is also how LinkedIn and X coverage works without platform
# credentials — via `site:linkedin.com` / `site:x.com` queries.
#
# The shipped settings.yml enables `formats: [html, json]`. SearXNG ships with
# JSON DISABLED; without that change every collector call returns HTML and the
# adapter reports "instance returned non-JSON".

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: d360ci-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Must match the published port or SearXNG builds wrong absolute URLs.
      - SEARXNG_BASE_URL=http://localhost:8888/
      # Generated per-deployment; override with your own secret in production.
      - SEARXNG_SECRET=change-me-d360-competitive-intel
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
